<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BraveBeats</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14100d; --panel: #1e1815; --line: #3a2f28;
    --text: #f0e6dc; --muted: #a3948a; --accent: #d97a44;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 1.75rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
  .row { display: flex; gap: .625rem; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; padding: .55rem 1.1rem; border-radius: 7px;
    border: 1px solid var(--line); background: #2a221d; color: var(--text); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1310; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .3rem; text-transform: uppercase; letter-spacing: .06em; }
  input[type=number], select {
    font: inherit; padding: .5rem .6rem; border-radius: 7px; border: 1px solid var(--line);
    background: #16110e; color: var(--text); width: 100%;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .875rem; }
  .intensity-value { font-variant-numeric: tabular-nums; font-size: 2rem; font-weight: 700; }
  .layers { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .75rem; }
  .chip {
    font-size: .72rem; padding: .2rem .5rem; border-radius: 20px; border: 1px solid var(--line);
    color: var(--muted); transition: all .15s;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #1a1310; font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; margin: 0; font-size: .875rem; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .status { color: var(--muted); font-size: .875rem; min-height: 1.4em; }
  .status.error { color: #e2725b; }
  code { background: #16110e; padding: .1rem .35rem; border-radius: 4px; font-size: .85em; }
</style>
</head>
<body>
<main>
  <h1>BraveBeats</h1>
  <p class="sub">Procedural tribal music. The seed decides the piece; intensity decides how much of the ensemble you hear.</p>

  <div class="panel">
    <div class="grid">
      <div><label for="seed">Seed</label><input id="seed" type="number" value="20260828" min="0" step="1"></div>
      <div><label for="bars">Loop bars</label><input id="bars" type="number" value="8" min="1" max="64"></div>
      <div><label for="scale">Scale</label><select id="scale"><option value="">from seed</option></select></div>
      <div><label for="meter">Meter</label><select id="meter">
        <option value="0">from seed</option><option value="12">12/8</option><option value="16">4/4</option>
      </select></div>
    </div>
    <div class="row" style="margin-top:1.1rem">
      <button id="play" class="primary">Play</button>
      <button id="stop" disabled>Stop</button>
      <button id="reseed">New seed</button>
      <button id="download">Render a WAV</button>
    </div>
    <p class="status" id="status">Press play. Audio needs a click before it can start.</p>
  </div>

  <div class="panel">
    <label for="intensity">Intensity</label>
    <div class="row" style="gap:1rem">
      <span class="intensity-value" id="intensity-value">1.00</span>
      <input id="intensity" type="range" min="0" max="1" step="0.01" value="1" style="flex:1">
    </div>
    <div class="layers" id="layers"></div>
    <p class="status" style="margin-bottom:0">Drag while it plays. Parts join and drop out on the next notes, never mid&#8209;stroke.</p>
  </div>

  <div class="panel">
    <dl id="info"><dt>Piece</dt><dd>nothing playing yet</dd></dl>
  </div>
</main>

<script type="module">
import { createAdaptive, renderToChannels, scaleNames } from '../dist/index.js';

const $ = (id) => document.getElementById(id);
const status = (text, isError = false) => {
  $('status').textContent = text;
  $('status').classList.toggle('error', isError);
};

// The intensity each part waits for, matching the thresholds in the composer
const LAYERS = [
  ['drone', 0], ['bell', 0.10], ['kick', 0.30], ['low drum', 0.34],
  ['shaker', 0.42], ['balafon', 0.44], ['mid drum', 0.52], ['slap', 0.60],
  ['kalimba', 0.62], ['chant', 0.66], ['high drum', 0.68], ['clap', 0.76],
];
$('layers').innerHTML = LAYERS.map(([name]) => `<span class="chip">${name}</span>`).join('');
const paintLayers = (value) => {
  document.querySelectorAll('.chip').forEach((chip, i) => {
    chip.classList.toggle('on', value >= LAYERS[i][1]);
  });
};
paintLayers(1);

for (const name of await scaleNames()) {
  $('scale').insertAdjacentHTML('beforeend', `<option value="${name}">${name}</option>`);
}

let context = null;
let track = null;

const options = () => ({
  seed: Number($('seed').value) || 0,
  loopBars: Number($('bars').value) || 8,
  scale: $('scale').value || undefined,
  meter: Number($('meter').value) || undefined,
  intensity: Number($('intensity').value),
});

$('play').addEventListener('click', async () => {
  try {
    $('play').disabled = true;
    status('building the piece…');
    await stop();
    context ??= new AudioContext();
    await context.resume();

    track = await createAdaptive(context, options());
    track.connect(context.destination);
    const info = await track.ready;
    // Handy for poking at the running graph from the console
    window.__ctx = context;
    window.__track = track;

    $('info').innerHTML = `
      <dt>Seed</dt><dd>${info.seed}</dd>
      <dt>Tempo</dt><dd>${info.tempo.toFixed(1)} bpm</dd>
      <dt>Meter</dt><dd>${info.pulsesPerBar === 12 ? '12/8' : '4/4'}</dd>
      <dt>Scale</dt><dd>${info.scale} on MIDI ${info.root}</dd>
      <dt>Loop</dt><dd>${info.totalBars} bars, ${info.loopSeconds.toFixed(2)}s</dd>
      <dt>Notes</dt><dd>${info.noteCount} in the loop</dd>`;
    status('playing — drag the intensity slider');
    $('stop').disabled = false;
  } catch (error) {
    status(String(error), true);
    $('play').disabled = false;
  }
});

async function stop() {
  if (track) { track.stop(); track = null; }
  $('stop').disabled = true;
  $('play').disabled = false;
}
$('stop').addEventListener('click', () => { stop(); status('stopped'); });

$('reseed').addEventListener('click', () => {
  $('seed').value = Math.floor(Math.random() * 1e9);
  if (track) $('play').click();
});

$('intensity').addEventListener('input', (event) => {
  const value = Number(event.target.value);
  $('intensity-value').textContent = value.toFixed(2);
  paintLayers(value);
  if (track) track.intensity = value;
});

$('download').addEventListener('click', async () => {
  const button = $('download');
  button.disabled = true;
  status('rendering 60 seconds offline…');
  try {
    const { left, right, sampleRate, info } = await renderToChannels({
      ...options(), loopBars: 0, duration: 60, sampleRate: 44100,
    });
    const url = URL.createObjectURL(new Blob([toWav(left, right, sampleRate)], { type: 'audio/wav' }));
    const link = Object.assign(document.createElement('a'), {
      href: url, download: `bravebeats-${info.seed}.wav`,
    });
    link.click();
    URL.revokeObjectURL(url);
    status(`rendered ${info.totalBars} bars at ${info.tempo.toFixed(1)} bpm`);
  } catch (error) {
    status(String(error), true);
  } finally {
    button.disabled = false;
  }
});

function toWav(left, right, sampleRate) {
  const frames = left.length;
  const buffer = new ArrayBuffer(44 + frames * 4);
  const view = new DataView(buffer);
  const tag = (at, text) => { for (let i = 0; i < 4; i++) view.setUint8(at + i, text.charCodeAt(i)); };
  tag(0, 'RIFF'); view.setUint32(4, 36 + frames * 4, true); tag(8, 'WAVE');
  tag(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 2, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 4, true); view.setUint16(32, 4, true); view.setUint16(34, 16, true);
  tag(36, 'data'); view.setUint32(40, frames * 4, true);
  for (let i = 0; i < frames; i++) {
    view.setInt16(44 + i * 4, Math.max(-1, Math.min(1, left[i])) * 32767, true);
    view.setInt16(46 + i * 4, Math.max(-1, Math.min(1, right[i])) * 32767, true);
  }
  return buffer;
}
</script>
</body>
</html>
